name: Cypress

# Spec 032 — real-browser gate for the funnel happy path + the DeliveryDatePicker
# real-browser catalog. Runs on every PR; required check (branch protection set
# in the repo admin UI). Pattern mirrors .github/workflows/ci.yml: Node 24 via
# .nvmrc, yarn cache, frozen-lockfile install, concurrency cancel-in-progress.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Cypress binary
        run: yarn workspace @sorrel/frontend cypress install

      - name: Build
        run: yarn workspace @sorrel/frontend build
        env:
          # Stripe publishable key is read at build time so the bundle ships
          # with it baked in (CheckoutForm.tsx calls loadStripe at module
          # scope). Without it, the PaymentElement never mounts and the
          # spec-039 happy-path leg fails on "Stripe test mode is not
          # configured". Per spec 039 §8.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Run Cypress
        # Run against the production build (`next start`, via the e2e:start
        # script) from the Build step above — not `next dev` — so the gate
        # exercises the real build artifact. The Build step produces the
        # `.next` output `next start` serves.
        run: yarn workspace @sorrel/frontend start-server-and-test e2e:start http://localhost:3000 cypress:run
        env:
          # `next start` reads these at request time for /api/checkout/intent
          # and /api/checkout/webhook. Test-mode keys only — see spec 039 §7
          # and the README's "Stripe test mode" subsection.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
