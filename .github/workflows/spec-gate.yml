name: Spec gate

# Governance authority (specs 015, 059): the local commit contract, enforced
# where it merges. Every non-merge commit in the PR must carry a `Spec: NNN`
# trailer that resolves to a spec already `approved: yes` on the base branch.
# The rules live in scripts/governance/spec-gate.sh and are proven by
# scripts/governance/spec-gate.test.mjs.
#
# Why pull_request_target: it runs THIS file and the gate script from the base
# branch, so a PR cannot weaken the gate it is judged by. The PR head is only
# fetched as git objects and read — never checked out, never executed.
# The push trigger is a detective control on main if protection is bypassed.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-trailer:
    name: Commits reference an approved spec
    runs-on: ubuntu-latest
    steps:
      # PR: the base revision. Push: main's new head (already on main, so trusted).
      - name: Check out the trusted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head as objects only
        if: github.event_name == 'pull_request_target'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"

      - name: Check Spec trailers + base approval
        env:
          BASE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/governance/spec-gate.sh "$BASE" "$HEAD_SHA"
